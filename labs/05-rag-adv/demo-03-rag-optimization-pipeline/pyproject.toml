[project]
name = "demo-03-rag-optimization-pipeline"
version = "1.0.0"
description = "Full RAG optimization pipeline: semantic chunking, hybrid search, cross-encoder re-ranking with Recall@K and MRR evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "langchain-experimental>=0.0.1",
    "langchain-classic>=1.0.0",
    "chromadb>=0.4.22",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "nltk>=3.8.0",
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py"]
