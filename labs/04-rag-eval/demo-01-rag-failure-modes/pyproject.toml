[project]
name = "demo-01-rag-failure-modes"
version = "0.1.0"
description = "RAG Failure Modes: Identify and demonstrate the 4 most common failure patterns in RAG systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py"]
