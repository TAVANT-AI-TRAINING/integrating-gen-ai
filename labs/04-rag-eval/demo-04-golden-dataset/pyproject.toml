[project]
name = "demo-04-golden-dataset"
version = "0.1.0"
description = "Golden Dataset: Auto-generate Q&A pairs and compare human vs automated evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py", "sample_documents.py"]
