[project]
name = "demo-06-langsmith-observability"
version = "0.1.0"
description = "LangSmith: Trace RAG pipeline, run batch evaluators, and view results in the dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langsmith>=0.3.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.4.22",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py"]
