[project]
name = "demo-05-ragas-evaluation"
version = "0.1.0"
description = "RAGAS Framework: Evaluate RAG pipeline with Faithfulness, Relevancy, Precision, Recall, and Correctness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ragas>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.4.22",
    "python-dotenv>=1.0.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py"]
