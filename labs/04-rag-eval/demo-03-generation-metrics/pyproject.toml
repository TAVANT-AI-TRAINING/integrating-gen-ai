[project]
name = "demo-03-generation-metrics"
version = "0.1.0"
description = "Generation Metrics: LLM-as-judge for Faithfulness, Relevance, Groundedness, and Answer Correctness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py"]
